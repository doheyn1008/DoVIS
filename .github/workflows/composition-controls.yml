name: Controlled native composition development

on:
  push:
    branches: [codex/composition-controls]
    paths:
      - '.github/workflows/composition-controls.yml'
      - 'experiments/mutual-understanding/mutual_lab/composition_*.py'
      - 'experiments/mutual-understanding/mutual_lab/development_models.py'
      - 'experiments/mutual-understanding/tests/test_composition_*.py'
      - 'experiments/mutual-understanding/tests/test_development_models.py'
      - 'experiments/mutual-understanding/configs/composition-cpu-requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: composition-controls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Same-runner comparisons (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        language: [ko, ja, en, es]
    defaults:
      run:
        working-directory: experiments/mutual-understanding
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r configs/composition-cpu-requirements.txt
          python -m pip install -e . --no-deps
      - name: Verify diagnostics, architecture controls and isolated production targets
        run: |
          python -m unittest discover -s tests -p test_composition_diagnostics.py -v
          python -m unittest discover -s tests -p test_development_models.py -v
          python -m unittest discover -s tests -p test_composition_suite.py -v
      - name: Save dependency lock observed on this runner
        run: |
          mkdir -p runs/composition-suite
          python -m pip freeze > runs/composition-suite/dependencies-${{ matrix.language }}.txt
      - name: Run six matched development conditions on one runner
        run: timeout --signal=INT --kill-after=30s 33m python -m mutual_lab.composition_suite --language '${{ matrix.language }}'
      - name: Save all completed and partial development results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composition-controls-${{ matrix.language }}-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/composition-suite/
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Report every language and condition
    if: always()
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: experiments/mutual-understanding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - uses: actions/download-artifact@v4
        with:
          pattern: composition-controls-*-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/composition-downloads/
          merge-multiple: true
      - name: Aggregate without optional tensor or shell search dependencies
        run: python -m mutual_lab.composition_suite --aggregate-dir runs/composition-downloads --output runs/composition-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composition-controls-summary-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/composition-summary.json
          if-no-files-found: error
          retention-days: 90
