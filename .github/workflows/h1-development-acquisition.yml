name: H1 development acquisition adapter

on:
  pull_request:
    paths: ['experiments/h1-acquisition/**', '.github/workflows/h1-development-acquisition.yml']
  push:
    branches: [main]
    paths: ['experiments/h1-acquisition/**', '.github/workflows/h1-development-acquisition.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-and-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: experiments/h1-acquisition
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU neural dependencies
        run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.5.4' 'Pillow==12.3.0'
      - name: Check frozen core source boundary
        run: python -c 'from run_smoke import verify_core_sources; print(verify_core_sources("configs/frozen-core-source-sha256.json"))'
      - name: Run adapter and procedural tests
        run: python -m unittest discover -s tests -v
      - name: Check explicit development pilot CLI
        run: python run_smoke.py --help
      # The genuine32-exposure pilot is explicitly frozen and run once outside
      # CI. Tests use synthetic local fixtures, never protected evaluation.
