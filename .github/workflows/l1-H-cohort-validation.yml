  validate_candidate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        language: [ko, ja, en, es]
        replica: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r configs/composition-cpu-requirements.txt
          python -m pip install -e . --no-deps
      - uses: actions/download-artifact@v4
        with:
          name: l1-H-cohort-input-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/H-cohort-input/
      - name: Preserve the exact candidate, first attempt, code and runtime provenance
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          source = Path('runs/H-cohort-input')
          context = json.loads((source / 'provenance/run-context.json').read_text())
          request_path = Path('configs/mastery-H-cohort-run.request.json')
          request = json.loads(request_path.read_text())
          if (os.environ['GITHUB_RUN_ATTEMPT'] != '1' or context.get('run_attempt') != '1'
                  or context.get('code_revision') != os.environ['GITHUB_SHA']
                  or str(context.get('run_id')) != os.environ['GITHUB_RUN_ID']
                  or context.get('request') != request
                  or context.get('request_sha256') != hashlib.sha256(request_path.read_bytes()).hexdigest()
                  or hashlib.sha256(Path('configs/mastery-H-cohort-plan.json').read_bytes()).hexdigest() != request['validation_plan_sha256']):
              raise ValueError('The single declared cohort attempt, request, plan or source changed')
          hashes = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('mutual_lab').glob('*.py')}
          if hashes != context.get('source_sha256'):
              raise ValueError('The verified candidate/cohort source differs in this language job')
          target = Path('runs/H-cohort/provenance-${{ matrix.language }}-r${{ matrix.replica }}')
          shutil.copytree(source / 'provenance', target)
          PY
          python -m pip freeze > runs/H-cohort/provenance-${{ matrix.language }}-r${{ matrix.replica }}/trial-dependencies.txt
      - name: Train one fresh fixed-candidate native learner without resuming language weights
        run: timeout --signal=INT --kill-after=30s 63m python -m mutual_lab.cohort_context_validation --config configs/neural.example.json --plan configs/mastery-H-cohort-plan.json --candidate-request configs/mastery-H-cohort-run.request.json --source-summary runs/H-cohort-input/source-summary.json --source-plan configs/mastery-H-plan.json --prior-bundle runs/H-cohort-input/prior/prior.pt --language '${{ matrix.language }}' --replica '${{ matrix.replica }}' --output runs/H-cohort
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-H-cohort-trial-${{ matrix.language }}-r${{ matrix.replica }}-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/H-cohort/
          if-no-files-found: error
          retention-days: 30

  aggregate_cohort:
    if: always()
    needs: [verify, validate_candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - uses: actions/download-artifact@v4
        id: aggregate_input
        continue-on-error: true
        with:
          name: l1-H-cohort-input-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/H-cohort-input/
      - uses: actions/download-artifact@v4
        id: aggregate_trials
        continue-on-error: true
        with:
          pattern: l1-H-cohort-trial-*-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/H-cohort-downloads/
          merge-multiple: true
      - name: Retain all twelve fixed-final outcomes and separate execution, provenance and targets
        if: always() && needs.verify.result == 'success'
        env:
          SOURCE_VERIFICATION: ${{ needs.verify.result }}
          INPUT_DOWNLOAD_RESULT: ${{ steps.aggregate_input.outcome }}
          TRIAL_DOWNLOAD_RESULT: ${{ steps.aggregate_trials.outcome }}
        run: |
          if [ "$INPUT_DOWNLOAD_RESULT" = "success" ] && [ "$TRIAL_DOWNLOAD_RESULT" = "success" ]; then
            mkdir -p runs/H-cohort-downloads
            python -m mutual_lab.cohort_context_validation --config configs/neural.example.json --plan configs/mastery-H-cohort-plan.json --candidate-request configs/mastery-H-cohort-run.request.json --source-summary runs/H-cohort-input/source-summary.json --source-plan configs/mastery-H-plan.json --prior-bundle runs/H-cohort-input/prior/prior.pt --aggregate-dir runs/H-cohort-downloads --output runs/H-cohort-summary.json
          else
            python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          directory = Path('runs/H-cohort-downloads')
          languages = ('ko', 'ja', 'en', 'es')
          expected = [(replica, language) for replica in range(3) for language in languages]
          available, unreadable, indexed = [], [], {}
          paths = sorted(directory.rglob('cohort-context-validation.json')) if directory.is_dir() else []
          for path in paths:
              relative = path.relative_to(directory).as_posix()
              try:
                  if path.is_symlink():
                      raise ValueError('Symlinked trial metadata is not read')
                  contents = path.read_bytes()
                  suite = json.loads(contents)
                  if not isinstance(suite, dict):
                      raise ValueError('Trial metadata must be an object')
                  language, replica = suite.get('language'), suite.get('replica')
                  valid_identity = language in languages and type(replica) is int and replica in range(3)
                  raw = suite.get('engine_report')
                  raw = raw if isinstance(raw, dict) else {}
                  status = suite.get('status') if isinstance(suite.get('status'), str) else 'unknown'
                  engine_status = raw.get('status') if isinstance(raw.get('status'), str) else 'unknown'
                  curves = raw.get('curves')
                  curves = curves if isinstance(curves, list) else []
                  checkpoints = raw.get('checkpoints')
                  checkpoints = checkpoints if isinstance(checkpoints, list) else []
                  recognized = suite.get('kind') == 'cohort-context-validation-v2' and raw.get('kind') == 'mastery-lab-v1-trial'
                  record = {'source_path': relative, 'source_sha256': hashlib.sha256(contents).hexdigest(),
                      'language': language if isinstance(language, str) else None,
                      'replica': replica if type(replica) is int else None,
                      'identity_valid': valid_identity, 'recognized_schema': recognized,
                      'status': status, 'engine_status': engine_status,
                      'training_steps_completed': raw.get('training_steps_completed') if type(raw.get('training_steps_completed')) is int else None,
                      'reported_budget_points': len(curves),
                      'reported_budget_steps': [point['step'] for point in curves if isinstance(point, dict) and type(point.get('step')) is int],
                      'checkpoint_manifests': len(checkpoints)}
                  available.append(record)
                  if valid_identity:
                      indexed.setdefault((replica, language), []).append(record)
              except (OSError, ValueError, TypeError) as error:
                  unreadable.append({'source_path': relative, 'error': type(error).__name__ + ': ' + str(error)})

          missing = [{'language': language, 'replica': replica} for replica, language in expected if (replica, language) not in indexed]
          duplicates = [{'language': language, 'replica': replica, 'source_paths': [record['source_path'] for record in records]}
              for (replica, language), records in sorted(indexed.items()) if len(records) != 1]
          execution_completed = (len(indexed) == 12 and not duplicates and all(
              record['recognized_schema'] and record['status'] == record['engine_status'] == 'completed'
              for records in indexed.values() for record in records))
          failed = [{'language': record['language'], 'replica': record['replica'], 'status': record['status'],
              'engine_status': record['engine_status'], 'source_path': record['source_path']}
              for record in available if record['identity_valid'] and (record['status'] != 'completed' or record['engine_status'] != 'completed')]
          downloads = {'input': os.environ.get('INPUT_DOWNLOAD_RESULT', 'unknown'),
              'trials': os.environ.get('TRIAL_DOWNLOAD_RESULT', 'unknown')}
          result = {'schema_version': 1, 'kind': 'cohort-context-validation-v2-comparison', 'status': 'incomplete',
              'execution_completed': execution_completed,
              'execution_evidence': 'Unverified downloaded trial metadata only; input/request provenance could not be validated',
              'provenance_valid': False, 'qualification_assessed': False, 'robust_development_candidate': False,
              'assessment': 'indeterminate_artifact_download', 'final_candidate_count': None,
              'source_verification': os.environ.get('SOURCE_VERIFICATION', 'unknown'),
              'artifact_downloads': downloads,
              'aggregation_error': 'Input or trial artifact download did not succeed; canonical aggregation was not attempted',
              'expected_jobs': 12, 'reported_jobs': len(indexed), 'available_trial_files': len(paths),
              'available_trials': available, 'unreadable_trial_files': unreadable,
              'unidentified_trial_files': [record['source_path'] for record in available if not record['identity_valid']],
              'invalid_schema_trial_files': [record['source_path'] for record in available if not record['recognized_schema']],
              'duplicate_trials': duplicates, 'missing_trials': missing, 'failed_trials': failed, 'rows': [],
              'missing_trials_meaning': 'No readable downloaded metadata identifies this cell; this does not assert that training never started',
              'native_training_rerun': False, 'excluded_from_research': True, 'eligible_for_fresh_experiment': False,
              'interpretation': 'Available trial states and missing cells are retained without assigning model-score qualification'}
          path = Path('runs/H-cohort-summary.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, indent=2, ensure_ascii=True, allow_nan=False) + '\n')
          print('Retained incomplete aggregation summary:', path)
          raise SystemExit(1)
          PY
          fi
      - name: Record blocked provenance and every unstarted cell when verification failed
        if: needs.verify.result != 'success'
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          missing = [{'language': language, 'replica': replica} for replica in range(3) for language in ('ko', 'ja', 'en', 'es')]
          result = {'schema_version': 1, 'kind': 'cohort-context-validation-v2-comparison', 'status': 'blocked',
              'execution_completed': False, 'provenance_valid': False, 'robust_development_candidate': False,
              'source_verification': os.environ['VERIFY_RESULT'], 'expected_jobs': 12, 'reported_jobs': 0,
              'missing_trials': missing, 'failed_trials': [], 'excluded_from_research': True,
              'eligible_for_fresh_experiment': False,
              'interpretation': 'No cohort qualification: source/request verification did not succeed; every unstarted cell is retained'}
          path = Path('runs/H-cohort-summary.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-H-cohort-summary-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/H-cohort-summary.json
          if-no-files-found: error
          retention-days: 30
