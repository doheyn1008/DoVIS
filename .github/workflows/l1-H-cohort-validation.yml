# Preparation is inert: no request file is created by this workflow prototype.
name: Fixed H producer-context fresh native-seed confirmation

on:
  push:
    branches: [codex/l1-mastery, codex/l1-memory]
    paths:
      - 'experiments/mutual-understanding/configs/mastery-H-cohort-run.request.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: l1-H-cohort-validation
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  PYTHONUNBUFFERED: '1'

defaults:
  run:
    working-directory: experiments/mutual-understanding

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_run_id: ${{ steps.request.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - name: Require one pinned H winner and the three untouched confirmation seed blocks
        id: request
        run: |
          python - <<'PY'
          import hashlib, json, os, re, shutil
          from pathlib import Path
          from dataclasses import asdict
          from mutual_lab.config import ExperimentConfig
          from mutual_lab.mastery_lab import MasteryPlan
          from mutual_lab.development_world import VERSION, development_manifest
          from mutual_lab.cohort_context_validation import _selection, _implementation_hashes
          if os.environ['GITHUB_REF'] not in ('refs/heads/codex/l1-mastery', 'refs/heads/codex/l1-memory'):
              raise ValueError('H confirmation is restricted to the two prepared branches')
          if os.environ['GITHUB_RUN_ATTEMPT'] != '1':
              raise ValueError('Only attempt one is admissible; failed native seed evidence is irreversible')
          path = Path('configs/mastery-H-cohort-run.request.json')
          if not path.is_file():
              raise RuntimeError('No pinned H-confirmation request exists; preparation does not activate training')
          request = json.loads(path.read_text())
          condition, spec, factory = _selection(request)
          expected = {'schema_version': 1, 'phase': 'H-confirmation', 'validation_run_attempt': 1,
              'source_summary_kind': 'producer-context-study-v1-comparison', 'fixed_prior_condition': 'B1',
              'fixed_final_step': 9600, 'policy': 'mixed_blocks', 'data_version': VERSION,
              'frozen_feature_policy': 'per_png_singleton_v1'}
          if any(request.get(key) != value for key, value in expected.items()):
              raise ValueError('The fixed H confirmation protocol changed')
          for key in ('schema_version', 'validation_run_attempt', 'fixed_final_step', 'source_run_id', 'source_run_attempt'):
              if type(request.get(key)) is not int or request[key] <= 0:
                  raise ValueError('An explicit integer pin is required: ' + key)
          if not isinstance(request.get('source_revision'), str) or not re.fullmatch('[0-9a-f]{40}', request['source_revision']):
              raise ValueError('Pin the immutable H discovery revision')
          for key in ('source_summary_sha256', 'source_plan_sha256', 'validation_plan_sha256',
                  'prior_manifest_sha256', 'prior_checkpoint_sha256', 'confirmation_implementation_sha256'):
              if not isinstance(request.get(key), str) or not re.fullmatch('[0-9a-f]{64}', request[key]):
                  raise ValueError('Pin exact H evidence/implementation bytes: ' + key)
          if not isinstance(request.get('rationale'), str) or not request['rationale'].strip():
              raise ValueError('Record the preregistered selection rationale')
          if _implementation_hashes(request) != request.get('candidate_source_sha256'):
              raise ValueError('The known H architecture/training implementation differs from its exact pins')
          if hashlib.sha256(Path('mutual_lab/cohort_context_validation.py').read_bytes()).hexdigest() != request['confirmation_implementation_sha256']:
              raise ValueError('The reviewed H confirmation implementation changed')
          if (request['source_plan_sha256'] != 'a2622ee9bada8ce5f79365fa790d90bf2902a806c8af4d4a389b5081009a962c'
                  or request['validation_plan_sha256'] != '88ffbc19a129d0191259ff43f69457c1d4185d51f6c9eb7a209788ebb8f8e9b3'):
              raise ValueError('Use precisely the frozen preregistered H discovery and confirmation plans')
          source_path, validation_path = Path('configs/mastery-H-plan.json'), Path('configs/mastery-H-cohort-plan.json')
          for key, original in (('source_plan_sha256', source_path), ('validation_plan_sha256', validation_path)):
              if hashlib.sha256(original.read_bytes()).hexdigest() != request[key]:
                  raise ValueError('The predeclared H plan differs from its request: ' + key)
          source, validation, reference = (json.loads(p.read_text()) for p in (source_path, validation_path, Path('configs/mastery-C-plan.json')))
          remove = {'seed_pairs', 'b_seed_pair', 'metadata'}
          comparable = lambda value: {k: v for k, v in value.items() if k not in remove}
          if comparable(source) != comparable(reference) or comparable(validation) != comparable(reference):
              raise ValueError('H may change only native seeds and descriptive metadata from C')
          discovery, fresh = [[79007,79009],[79017,79019],[79027,79029]], [[99007,99009],[99017,99019],[99027,99029]]
          if (source.get('seed_pairs') != discovery or source.get('b_seed_pair') != discovery[0]
                  or validation.get('seed_pairs') != fresh or validation.get('b_seed_pair') != fresh[0]):
              raise ValueError('Use precisely the predeclared H discovery and untouched H confirmation seeds')
          config = ExperimentConfig.load('configs/neural.example.json')
          plan = MasteryPlan.load(validation_path).validate(config)
          if (plan.budgets != (2400,4800,9600) or plan.max_trial_seconds != 3600
                  or (plan.comprehension_min,plan.production_min,plan.contrast_min) != (.9,.9,.9)
                  or (plan.min_contrast_anchors,plan.min_contrast_pairs) != (8,2)):
              raise ValueError('Retain the C final budget, six targets, coverage and time bounds')
          data = development_manifest(config, plan.data_seed)
          if (data['scene_counts'] != {'train':220,'dev':112} or data['protected_pairs_excluded'] != 22
                  or plan.metadata.get('data_version') != VERSION or plan.metadata.get('data_pair_sha256') != data['pair_sha256']):
              raise ValueError('Retain the C native-data population and 22 protected exclusions')
          directory = Path('runs/H-cohort-input/provenance'); directory.mkdir(parents=True, exist_ok=True)
          for original, name in ((path,'request.json'),(source_path,'source-plan.json'),(validation_path,'validation-plan.json'),(Path('configs/neural.example.json'),'config.json')):
              shutil.copyfile(original, directory / name)
          (directory / 'data-manifest.json').write_text(json.dumps(data, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_run_id=' + str(request['source_run_id']) + '\n')
          PY
      - name: Reject a previously admitted identical cohort request across both branches
        id: admission
        env:
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          
          WORKFLOW_PATH = '.github/workflows/l1-H-cohort-validation.yml'
          REQUEST_PATH = 'experiments/mutual-understanding/configs/mastery-H-cohort-run.request.json'
          BRANCHES = ('codex/l1-mastery', 'codex/l1-memory')
          request_sha = hashlib.sha256(Path('configs/mastery-H-cohort-run.request.json').read_bytes()).hexdigest()
          evidence_path = Path('runs/H-cohort-input/provenance/admission.json')
          evidence_path.parent.mkdir(parents=True, exist_ok=True)
          audit = {'schema_version': 1, 'status': 'checking', 'request_sha256': request_sha,
              'workflow_path': WORKFLOW_PATH, 'branches': list(BRANCHES),
              'admission_boundary': 'The first workflow attempt verify job completed with success',
              'history_pages': 0, 'prior_runs_checked': 0, 'requests_missing_before_activation': 0,
              'matching_prior_requests': []}
          
          def save():
              evidence_path.write_text(json.dumps(audit, indent=2) + '\n')
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          def timestamp(value):
              if not isinstance(value, str):
                  raise ValueError('A workflow creation timestamp is missing')
              result = datetime.datetime.fromisoformat(value.replace('Z', '+00:00'))
              if result.tzinfo is None:
                  raise ValueError('Workflow creation timestamps must include a timezone')
              return result
          
          try:
              if os.environ['GITHUB_RUN_ATTEMPT'] != '1':
                  raise ValueError('Only the original cohort workflow attempt may be admitted')
              raw_id = os.environ['GITHUB_RUN_ID']
              if not re.fullmatch('[1-9][0-9]*', raw_id):
                  raise ValueError('The current workflow run ID is invalid')
              current_id = int(raw_id)
              repository = os.environ['GITHUB_REPOSITORY']
              if not re.fullmatch('[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
                  raise ValueError('The repository identity is invalid')
              opener = urllib.request.build_opener(NoRedirect())
              base = 'https://api.github.com/repos/' + repository
          
              def github(path):
                  query = urllib.request.Request(base + path, headers={
                      'Authorization': 'Bearer ' + os.environ['SOURCE_GITHUB_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
                  with opener.open(query, timeout=30) as response:
                      result = json.load(response)
                  if not isinstance(result, dict):
                      raise ValueError('GitHub returned an invalid API object')
                  return result
          
              current = github('/actions/runs/' + str(current_id))
              if (current.get('id') != current_id or current.get('path') != WORKFLOW_PATH
                      or current.get('head_branch') not in BRANCHES
                      or current.get('repository', {}).get('full_name') != repository):
                  raise ValueError('The current cohort workflow identity is uncertain')
              timestamp(current.get('created_at'))
              audit['current_run'] = {'id': current_id, 'html_url': current.get('html_url'),
                  'head_branch': current['head_branch'], 'created_at': current['created_at']}
              seen_pages, seen_runs = set(), {}
          
              # Scan repository-wide history, across both branches and workflow IDs.
              # No branch/date filter, time cutoff, or page-count cap may hide admission.
              page = 1
              while True:
                  payload = github('/actions/runs?' + urllib.parse.urlencode({'per_page': 100, 'page': page}))
                  runs = payload.get('workflow_runs')
                  if not isinstance(runs, list):
                      raise ValueError('GitHub workflow history is incomplete or invalid')
                  audit['history_pages'] += 1
                  if not runs:
                      break
                  ids = tuple(run.get('id') if isinstance(run, dict) else None for run in runs)
                  if any(type(run_id) is not int or run_id <= 0 for run_id in ids) or ids in seen_pages:
                      raise ValueError('GitHub workflow pagination stalled or contains invalid run IDs')
                  seen_pages.add(ids)
                  for run in runs:
                      run_id = run['id']
                      if run_id == current_id:
                          continue
                      path = run.get('path')
                      if not isinstance(path, str):
                          raise ValueError('A historical workflow path is missing')
                      if path != WORKFLOW_PATH:
                          continue
                      branch = run.get('head_branch')
                      if not isinstance(branch, str):
                          raise ValueError('A historical cohort branch is missing')
                      if branch not in BRANCHES:
                          continue
                      if run.get('repository', {}).get('full_name') != repository:
                          raise ValueError('A historical cohort repository is uncertain')
                      revision = run.get('head_sha')
                      if not isinstance(revision, str) or not re.fullmatch('[0-9a-f]{40}', revision):
                          raise ValueError('A historical cohort code revision is missing')
                      if run_id in seen_runs:
                          if seen_runs[run_id] != revision:
                              raise ValueError('A historical run changed revision during pagination')
                          continue
                      seen_runs[run_id] = revision
                      # Global serialization does not promise creation-order execution.
                      # Inspect every other run's original verification, even when its
                      # creation timestamp is later than the current run's.
                      timestamp(run.get('created_at'))
                      audit['prior_runs_checked'] += 1
                      try:
                          item = github('/contents/' + REQUEST_PATH + '?' + urllib.parse.urlencode({'ref': revision}))
                      except urllib.error.HTTPError as error:
                          if error.code != 404:
                              raise
                          commit = github('/commits/' + revision)
                          if commit.get('sha') != revision:
                              raise ValueError('A missing request cannot be distinguished from an unavailable historical revision')
                          audit['requests_missing_before_activation'] += 1
                          audit.setdefault('verified_absent_request_revisions', []).append(revision)
                          continue
                      if item.get('type') != 'file' or item.get('encoding') != 'base64' or not isinstance(item.get('content'), str):
                          raise ValueError('A historical request file cannot be verified')
                      contents = base64.b64decode(''.join(item['content'].split()), validate=True)
                      if hashlib.sha256(contents).hexdigest() != request_sha:
                          continue
                      prior = {key: run.get(key) for key in ('id', 'html_url', 'head_sha', 'head_branch',
                          'created_at', 'status', 'conclusion', 'run_attempt')}
                      audit['matching_prior_requests'].append(prior)
                      jobs, job_pages, job_page = [], set(), 1
                      while True:
                          # A later failed rerun cannot hide successful original verify.
                          response = github('/actions/runs/' + str(run_id) + '/attempts/1/jobs?'
                              + urllib.parse.urlencode({'per_page': 100, 'page': job_page}))
                          batch = response.get('jobs')
                          if not isinstance(batch, list):
                              raise ValueError('The first-attempt job history is invalid')
                          if not batch:
                              break
                          job_ids = tuple(job.get('id') if isinstance(job, dict) else None for job in batch)
                          if any(type(job_id) is not int or job_id <= 0 for job_id in job_ids) or job_ids in job_pages:
                              raise ValueError('First-attempt job pagination stalled or is invalid')
                          job_pages.add(job_ids)
                          jobs.extend(batch)
                          job_page += 1
                      verify = [job for job in jobs if job.get('name') == 'verify']
                      if (not jobs and type(run.get('run_attempt')) is int and run['run_attempt'] == 1
                              and run.get('status') in ('queued', 'waiting', 'pending', 'requested')):
                          # This first attempt has not started any job and cannot pass
                          # verify while this workflow owns the shared global lock.
                          prior['admission'] = 'first_attempt_not_started'
                          continue
                      if len(verify) != 1:
                          raise ValueError('The original verification outcome cannot be established for run ' + str(run_id))
                      verification = verify[0]
                      prior['first_attempt_verify'] = {key: verification.get(key) for key in ('id', 'status', 'conclusion')}
                      if verification.get('status') != 'completed':
                          raise ValueError('An earlier identical request has unresolved first verification: ' + str(run_id))
                      conclusion = verification.get('conclusion')
                      if conclusion == 'success':
                          audit['status'] = 'previously_admitted'
                          audit['blocking_run'] = prior
                          raise RuntimeError('This exact cohort request was already admitted by first-attempt verify SUCCESS in run '
                              + str(run_id) + ' (' + str(run.get('html_url')) + '), latest status='
                              + str(run.get('status')) + '/' + str(run.get('conclusion'))
                              + '. Preserve that run and all failed seed cells; a new run ID cannot replace it.')
                      if conclusion not in ('failure', 'cancelled', 'timed_out', 'skipped', 'neutral',
                                            'action_required', 'stale', 'startup_failure'):
                          raise ValueError('The original verification conclusion is uncertain')
                      prior['admission'] = 'not_admitted_verify_did_not_succeed'
                  page += 1
              audit['status'] = 'no_prior_admission'
              save()
              print('No earlier first-attempt verify success for pinned request SHA256 ' + request_sha)
          except Exception as error:
              if audit['status'] != 'previously_admitted':
                  audit['status'] = 'blocked_uncertain'
              audit['error'] = type(error).__name__ + ': ' + str(error)
              save()
              raise
          PY
      - uses: actions/download-artifact@v4
        with:
          name: l1-H-input-${{ steps.request.outputs.source_run_id }}
          run-id: ${{ steps.request.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: experiments/mutual-understanding/runs/H-cohort-input/source-input/
      - uses: actions/download-artifact@v4
        with:
          name: l1-H-summary-${{ steps.request.outputs.source_run_id }}
          run-id: ${{ steps.request.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: experiments/mutual-understanding/runs/H-cohort-input/source-summary/
      - name: Verify the completed H discovery, exact frozen source and sole shared C prior
        env:
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, shutil, urllib.parse, urllib.request
          from pathlib import Path
          from mutual_lab.config import ExperimentConfig
          from mutual_lab.mastery_lab import MasteryPlan
          from mutual_lab.development_world import development_manifest
          from mutual_lab.cohort_context_validation import load_candidate_request, _selection, _implementation_hashes
          directory = Path('runs/H-cohort-input')
          request_path = Path('configs/mastery-H-cohort-run.request.json')
          request = json.loads(request_path.read_text())
          condition, spec, factory = _selection(request)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          repository = os.environ['GITHUB_REPOSITORY']
          if not re.fullmatch('[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', repository):
              raise ValueError('Invalid repository identity')
          def github(path):
              query = urllib.request.Request('https://api.github.com/repos/' + repository + path, headers={
                  'Authorization':'Bearer ' + os.environ['SOURCE_GITHUB_TOKEN'], 'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28'})
              with opener.open(query, timeout=30) as response:
                  return json.load(response)
          source_run = github('/actions/runs/' + str(request['source_run_id']) + '/attempts/' + str(request['source_run_attempt']))
          if (source_run.get('id') != request['source_run_id'] or source_run.get('run_attempt') != request['source_run_attempt']
                  or source_run.get('head_sha') != request['source_revision']
                  or source_run.get('path') != '.github/workflows/l1-producer-context-H.yml'
                  or source_run.get('head_branch') not in ('codex/l1-mastery','codex/l1-memory')
                  or source_run.get('repository',{}).get('full_name') != repository
                  or source_run.get('status') != 'completed' or source_run.get('conclusion') != 'success'):
              raise ValueError('The pinned H discovery workflow revision/attempt/identity did not complete successfully')
          paths = list((directory / 'source-summary').rglob('producer-context-H-summary.json'))
          if len(paths) != 1 or hashlib.sha256(paths[0].read_bytes()).hexdigest() != request['source_summary_sha256']:
              raise ValueError('Expected exactly the pinned complete H discovery summary')
          shutil.copyfile(paths[0], directory / 'source-summary.json')
          source_input = directory / 'source-input'
          inherited = source_input / 'provenance'
          context = json.loads((inherited / 'run-context.json').read_text())
          source_request_path = inherited / 'request.json'
          source_request = json.loads(source_request_path.read_text())
          if (context.get('code_revision') != request['source_revision']
                  or str(context.get('run_id')) != str(request['source_run_id'])
                  or str(context.get('run_attempt')) != str(request['source_run_attempt'])
                  or context.get('repository') != repository or context.get('request') != source_request
                  or context.get('request_sha256') != hashlib.sha256(source_request_path.read_bytes()).hexdigest()
                  or context.get('fixed_prior_condition') != 'B1'
                  or source_request.get('fixed_prior_condition') != 'B1'
                  or source_request.get('prior_manifest_sha256') != request['prior_manifest_sha256']
                  or source_request.get('data_version') != request['data_version']
                  or source_request.get('policy') != request['policy']):
              raise ValueError('H discovery provenance differs from its pinned source run/request/prior')
          current_hashes = {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(Path('mutual_lab').glob('*.py'))}
          if context.get('source_sha256') != current_hashes:
              raise ValueError('Every NN/data/training/H/confirmation module must be frozen before discovery, with no compatibility exception')
          if _implementation_hashes(request) != request['candidate_source_sha256']:
              raise ValueError('The original selected H factory differs from its exact architecture/training pins')
          if hashlib.sha256((inherited / 'plan.json').read_bytes()).hexdigest() != request['source_plan_sha256']:
              raise ValueError('The H discovery plan differs from its exact byte pin')
          if (inherited / 'config.json').read_bytes() != Path('configs/neural.example.json').read_bytes():
              raise ValueError('The C numerical configuration changed after discovery')
          config = ExperimentConfig.load('configs/neural.example.json')
          plan = MasteryPlan.load('configs/mastery-H-cohort-plan.json').validate(config)
          data = development_manifest(config, plan.data_seed)
          if json.loads((inherited / 'data-manifest.json').read_text()) != data:
              raise ValueError('The selected C data population or protected exclusions changed')
          prior_paths = list(source_input.rglob('prior.json'))
          if not prior_paths or any(hashlib.sha256(p.read_bytes()).hexdigest() != request['prior_manifest_sha256'] for p in prior_paths):
              raise ValueError('Only the single pinned canonical C prior manifest may be inherited')
          checkpoints = list(source_input.rglob('*.pt'))
          if not checkpoints or any(p.name != 'prior.pt' or hashlib.sha256(p.read_bytes()).hexdigest() != request['prior_checkpoint_sha256'] for p in checkpoints):
              raise ValueError('Never inherit source L1 checkpoints: only the exact shared C image prior is allowed')
          canonical = directory / 'prior'; canonical.mkdir(exist_ok=True)
          shutil.copyfile(prior_paths[0], canonical / 'prior.json')
          shutil.copyfile(prior_paths[0].with_suffix('.pt'), canonical / 'prior.pt')
          record = load_candidate_request(request_path, plan, plan_path='configs/mastery-H-cohort-plan.json',
              prior_path=canonical / 'prior.pt', source_summary_path=directory / 'source-summary.json',
              source_plan_path='configs/mastery-H-plan.json')
          admission = json.loads((directory / 'provenance/admission.json').read_text())
          if (admission.get('status') != 'no_prior_admission' or admission.get('request_sha256') != record['sha256']
                  or str(admission.get('current_run',{}).get('id')) != os.environ['GITHUB_RUN_ID']):
              raise ValueError('The global immutable admission record differs from this request/run')
          provenance = {'code_revision':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
              'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'repository':repository,'request':request,
              'request_sha256':record['sha256'],'source_sha256':current_hashes,'candidate_spec':spec,
              'source_condition':condition,'original_factory':factory,'source_run':source_run,
              'confirmation_implementation_sha256':request['confirmation_implementation_sha256'],
              'source_language_checkpoints_downloaded_or_resumed':False,'admission':admission,
              'fresh_seed_pairs':[[99007,99009],[99017,99019],[99027,99029]],
              'qualification_scope':'All12 final native-seed cells must pass all six .9 targets and coverage8/2; selected development data and shared C prior only; no research promotion'}
          (directory / 'provenance/run-context.json').write_text(json.dumps(provenance,indent=2) + '\n')
          print('Verified one common H winner from all24 source trials, exact frozen source and sole C image prior')
          PY
      - name: Install unchanged pinned numerical dependencies
        run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r configs/composition-cpu-requirements.txt
          python -m pip install -e . --no-deps
      - name: Verify prior tensors, original targets, and the complete regression suite
        run: |
          python - <<'PY'
          from pathlib import Path
          from mutual_lab.config import ExperimentConfig
          from mutual_lab.mastery_lab import MasteryPlan
          from mutual_lab.development_world import development_splits, render_scene
          from mutual_lab.spatial_prior import fit_pool_hash, load_prior_bundle
          from mutual_lab.cohort_context_validation import load_candidate_request
          config = ExperimentConfig.load('configs/neural.example.json')
          plan = MasteryPlan.load('configs/mastery-H-cohort-plan.json').validate(config)
          pngs = [render_scene(scene) for scene in development_splits(config, plan.data_seed)['train']]
          bundle = load_prior_bundle('runs/H-cohort-input/prior/prior.pt', expected_fit_pool_sha256=fit_pool_hash(pngs))
          if bundle['report']['status'] != 'completed':
              raise ValueError('The cohort may load only the identical completed C image-only prior')
          load_candidate_request('configs/mastery-H-cohort-run.request.json', plan,
              plan_path='configs/mastery-H-cohort-plan.json', prior_path='runs/H-cohort-input/prior/prior.pt',
              source_summary_path='runs/H-cohort-input/source-summary.json', source_plan_path='configs/mastery-H-plan.json')
          PY
          python -m unittest discover -s tests -v
          python -m pip freeze > runs/H-cohort-input/provenance/dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-H-cohort-input-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/H-cohort-input/
          if-no-files-found: error
          retention-days: 30

  validate_candidate:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        language: [ko, ja, en, es]
        replica: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r configs/composition-cpu-requirements.txt
          python -m pip install -e . --no-deps
      - uses: actions/download-artifact@v4
        with:
          name: l1-H-cohort-input-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/H-cohort-input/
      - name: Preserve the exact candidate, first attempt, code and runtime provenance
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          source = Path('runs/H-cohort-input')
          context = json.loads((source / 'provenance/run-context.json').read_text())
          request_path = Path('configs/mastery-H-cohort-run.request.json')
          request = json.loads(request_path.read_text())
          if (os.environ['GITHUB_RUN_ATTEMPT'] != '1' or context.get('run_attempt') != '1'
                  or context.get('code_revision') != os.environ['GITHUB_SHA']
                  or str(context.get('run_id')) != os.environ['GITHUB_RUN_ID']
                  or context.get('request') != request
                  or context.get('request_sha256') != hashlib.sha256(request_path.read_bytes()).hexdigest()
                  or hashlib.sha256(Path('configs/mastery-H-cohort-plan.json').read_bytes()).hexdigest() != request['validation_plan_sha256']):
              raise ValueError('The single declared cohort attempt, request, plan or source changed')
          hashes = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('mutual_lab').glob('*.py')}
          if hashes != context.get('source_sha256'):
              raise ValueError('The verified candidate/cohort source differs in this language job')
          target = Path('runs/H-cohort/provenance-${{ matrix.language }}-r${{ matrix.replica }}')
          shutil.copytree(source / 'provenance', target)
          PY
          python -m pip freeze > runs/H-cohort/provenance-${{ matrix.language }}-r${{ matrix.replica }}/trial-dependencies.txt
      - name: Train one fresh fixed-candidate native learner without resuming language weights
        run: timeout --signal=INT --kill-after=30s 63m python -m mutual_lab.cohort_context_validation --config configs/neural.example.json --plan configs/mastery-H-cohort-plan.json --candidate-request configs/mastery-H-cohort-run.request.json --source-summary runs/H-cohort-input/source-summary.json --source-plan configs/mastery-H-plan.json --prior-bundle runs/H-cohort-input/prior/prior.pt --language '${{ matrix.language }}' --replica '${{ matrix.replica }}' --output runs/H-cohort
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-H-cohort-trial-${{ matrix.language }}-r${{ matrix.replica }}-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/H-cohort/
          if-no-files-found: error
          retention-days: 30

  aggregate_cohort:
    if: always()
    needs: [verify, validate_candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: l1-H-cohort-input-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/H-cohort-input/
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: l1-H-cohort-trial-*-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/H-cohort-downloads/
          merge-multiple: true
      - name: Retain all twelve fixed-final outcomes and separate execution, provenance and targets
        if: needs.verify.result == 'success'
        run: |
          mkdir -p runs/H-cohort-downloads
          python -m mutual_lab.cohort_context_validation --config configs/neural.example.json --plan configs/mastery-H-cohort-plan.json --candidate-request configs/mastery-H-cohort-run.request.json --source-summary runs/H-cohort-input/source-summary.json --source-plan configs/mastery-H-plan.json --prior-bundle runs/H-cohort-input/prior/prior.pt --aggregate-dir runs/H-cohort-downloads --output runs/H-cohort-summary.json
      - name: Record blocked provenance and every unstarted cell when verification failed
        if: needs.verify.result != 'success'
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          missing = [{'language': language, 'replica': replica} for replica in range(3) for language in ('ko', 'ja', 'en', 'es')]
          result = {'schema_version': 1, 'kind': 'cohort-context-validation-v2-comparison', 'status': 'blocked',
              'execution_completed': False, 'provenance_valid': False, 'robust_development_candidate': False,
              'source_verification': os.environ['VERIFY_RESULT'], 'expected_jobs': 12, 'reported_jobs': 0,
              'missing_trials': missing, 'failed_trials': [], 'excluded_from_research': True,
              'eligible_for_fresh_experiment': False,
              'interpretation': 'No cohort qualification: source/request verification did not succeed; every unstarted cell is retained'}
          path = Path('runs/H-cohort-summary.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(result, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-H-cohort-summary-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/H-cohort-summary.json
          if-no-files-found: error
          retention-days: 30
