name: Expanded-development frozen-prior L1 comparison

on:
  push:
    branches: [codex/l1-mastery]
    paths:
      - 'experiments/mutual-understanding/configs/mastery-C-run.request.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: l1-mastery-C-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTHONHASHSEED: '0'
  PYTHONUNBUFFERED: '1'

defaults:
  run:
    working-directory: experiments/mutual-understanding

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      policy: ${{ steps.request.outputs.policy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - name: Validate the explicit request and frozen C plan
        id: request
        run: |
          python - <<'PY'
          import hashlib, json, os, re, shutil
          from pathlib import Path
          from mutual_lab.config import ExperimentConfig
          from mutual_lab.mastery_lab import MasteryPlan
          from mutual_lab.development_world import VERSION, development_manifest
          request_path = Path('configs/mastery-C-run.request.json')
          if not request_path.is_file():
              raise RuntimeError('Create configs/mastery-C-run.request.json with a pinned A selection before requesting C')
          directory = Path('runs/mastery-C-request')
          directory.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(request_path, directory / 'request.json')
          request = json.loads(request_path.read_text())
          if request.get('schema_version') != 1 or type(request.get('schema_version')) is not int:
              raise ValueError('Unsupported C request schema')
          if request.get('policy') not in ('same_pair', 'attributes'):
              raise ValueError('C policy must be same_pair or attributes')
          if request.get('selection_mode') not in ('selected', 'fallback_incomplete'):
              raise ValueError('The request must identify whether A selected the policy or was incomplete')
          source_id = request.get('phase_a_run_id')
          if type(source_id) is not int or source_id <= 0:
              raise ValueError('A positive phase_a_run_id is required')
          for key, length in (('phase_a_revision', 40), ('phase_a_summary_sha256', 64), ('plan_sha256', 64)):
              if not isinstance(request.get(key), str) or not re.fullmatch('[0-9a-f]{' + str(length) + '}', request[key]):
                  raise ValueError('Invalid pinned source hash: ' + key)
          plan_path = Path('configs/mastery-C-plan.json')
          if hashlib.sha256(plan_path.read_bytes()).hexdigest() != request['plan_sha256']:
              raise ValueError('The C plan differs from the plan pinned in the request')
          config = ExperimentConfig.load('configs/neural.example.json')
          plan = MasteryPlan.load(plan_path).validate(config)
          if plan.max_trial_seconds > 3600 or plan.max_suite_seconds > 10800:
              raise ValueError('The C plan exceeds this workflow CPU time allowance')
          manifest = development_manifest(config, plan.data_seed)
          if request.get('data_version') != VERSION or plan.metadata.get('data_version') != VERSION:
              raise ValueError('The request and plan must explicitly identify the expanded data population')
          if plan.metadata.get('data_pair_sha256') != manifest['pair_sha256']:
              raise ValueError('The C split differs from the frozen semantic split')
          if manifest['scene_counts'] != {'train': 220, 'dev': 112} or manifest['protected_pairs_excluded'] != 22:
              raise ValueError('Expanded data coverage or protected-pair exclusion changed')
          shutil.copyfile(plan_path, directory / 'plan.json')
          (directory / 'data-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('policy=' + request['policy'] + '\n')
              output.write('source_run_id=' + str(source_id) + '\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: l1-A-summary-${{ steps.request.outputs.source_run_id }}
          run-id: ${{ steps.request.outputs.source_run_id }}
          github-token: ${{ github.token }}
          path: experiments/mutual-understanding/runs/mastery-C-source-A/
      - name: Verify the policy against its original A artifact and code revision
        env:
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil, urllib.request
          from pathlib import Path
          request = json.loads(Path('configs/mastery-C-run.request.json').read_text())
          paths = list(Path('runs/mastery-C-source-A').rglob('mastery-A-summary.json'))
          if len(paths) != 1:
              raise ValueError('Expected exactly one source A summary')
          source_path = paths[0]
          if hashlib.sha256(source_path.read_bytes()).hexdigest() != request['phase_a_summary_sha256']:
              raise ValueError('Source A artifact does not match its pinned SHA256')
          source = json.loads(source_path.read_text())
          if source.get('phase') != 'A' or source.get('kind') != 'mastery-lab-v1-comparison':
              raise ValueError('The supplied artifact is not an A comparison')
          selected = source['b_policy_selection']['policy']
          if selected in ('same_pair', 'attributes'):
              if (source['status'] != 'completed' or source['missing_languages'] or source['failed_trials']
                      or request['selection_mode'] != 'selected' or request['policy'] != selected):
                  raise ValueError('C request does not preserve the complete A selection')
          elif (selected != 'undetermined' or request['selection_mode'] != 'fallback_incomplete'
                or request['policy'] != 'same_pair'):
              raise ValueError('An incomplete A comparison permits only the explicitly labeled same_pair fallback')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          endpoint = ('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY']
                      + '/actions/runs/' + str(request['phase_a_run_id']))
          query = urllib.request.Request(endpoint, headers={
              'Authorization': 'Bearer ' + os.environ['SOURCE_GITHUB_TOKEN'],
              'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.build_opener(NoRedirect()).open(query, timeout=30) as response:
              run = json.load(response)
          if run['id'] != request['phase_a_run_id'] or run['head_sha'] != request['phase_a_revision']:
              raise ValueError('The A run code revision does not match the request')
          directory = Path('runs/mastery-C-request')
          shutil.copyfile(source_path, directory / 'source-A-summary.json')
          context = {'code_revision': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                     'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'repository': os.environ['GITHUB_REPOSITORY'],
                     'source_a': {key: run[key] for key in ('id', 'head_sha', 'html_url', 'name')},
                     'request': request, 'selection_mode': request['selection_mode']}
          (directory / 'run-context.json').write_text(json.dumps(context, indent=2) + '\n')
          print('Verified pinned A policy:', request['policy'], 'selection:', request['selection_mode'])
          PY
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r configs/composition-cpu-requirements.txt
          python -m pip install -e . --no-deps
      - name: Run the complete regression and neural test suite
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-C-request-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/mastery-C-request/
          if-no-files-found: error
          retention-days: 30

  image_prior:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r configs/composition-cpu-requirements.txt
          python -m pip install -e . --no-deps
      - uses: actions/download-artifact@v4
        with:
          name: l1-C-request-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/mastery-C-prior/provenance/
      - name: Pretrain the common prior on exactly 220 fit PNGs
        run: |
          python - <<'PY'
          from pathlib import Path
          from mutual_lab.config import ExperimentConfig
          from mutual_lab.mastery_lab import MasteryPlan
          from mutual_lab.development_world import development_splits, render_scene
          from mutual_lab.spatial_prior import pretrain_prior, save_prior_bundle
          from mutual_lab.diagnostics import safe_json
          config = ExperimentConfig.load('configs/neural.example.json')
          plan = MasteryPlan.load('configs/mastery-C-plan.json').validate(config)
          fit = development_splits(config, plan.data_seed)['train']
          pngs = [render_scene(scene) for scene in fit]
          if len(pngs) != 220:
              raise ValueError('The fixed C fit image count changed')
          settings = plan.metadata['b_prior']
          bundle = pretrain_prior(pngs, seed=settings['seed'], dim=plan.model_profile.hidden_dim,
                                  steps=settings['steps'], batch_size=settings['batch_size'],
                                  learning_rate=settings['learning_rate'], max_seconds=settings['max_seconds'])
          save_prior_bundle(bundle, 'runs/mastery-C-prior/prior.pt')
          safe_json(Path('runs/mastery-C-prior/report.json'), bundle['report'])
          if bundle['report']['status'] != 'completed':
              raise RuntimeError('The fixed C image-pretraining budget did not complete')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-C-prior-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/mastery-C-prior/
          if-no-files-found: error
          retention-days: 30

  phase_c:
    needs: [verify, image_prior]
    runs-on: ubuntu-latest
    timeout-minutes: 190
    strategy:
      fail-fast: false
      matrix:
        language: [ko, ja, en, es]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: |
          python -m pip install 'torch==2.15.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r configs/composition-cpu-requirements.txt
          python -m pip install -e . --no-deps
      - uses: actions/download-artifact@v4
        with:
          name: l1-C-prior-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/mastery-C-prior/
      - uses: actions/download-artifact@v4
        with:
          name: l1-C-request-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/mastery-C/provenance-${{ matrix.language }}/
      - name: Record the resolved runtime
        run: python -m pip freeze > runs/mastery-C/provenance-${{ matrix.language }}/dependencies.txt
      - name: Compare C0 and C1 on the separately versioned development world
        run: timeout --signal=INT --kill-after=30s 183m python -m mutual_lab.mastery_lab --phase C --language '${{ matrix.language }}' --plan configs/mastery-C-plan.json --policy '${{ needs.verify.outputs.policy }}' --prior-bundle runs/mastery-C-prior/prior.pt --output runs/mastery-C
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-C-trials-${{ matrix.language }}-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/mastery-C/
          if-no-files-found: error
          retention-days: 30

  aggregate_c:
    if: always()
    needs: phase_c
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - uses: actions/download-artifact@v4
        with:
          pattern: l1-C-trials-*-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/mastery-C-downloads/
          merge-multiple: true
      - name: Aggregate every completed and partial C trial
        run: python -m mutual_lab.mastery_lab --phase C --aggregate-dir runs/mastery-C-downloads --output runs/mastery-C-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l1-C-summary-${{ github.run_id }}
          path: experiments/mutual-understanding/runs/mastery-C-summary.json
          if-no-files-found: error
          retention-days: 30
