name: Mutual understanding lab

on:
  push:
    branches: [main]
    paths:
      - 'experiments/mutual-understanding/**'
      - '.github/workflows/mutual-understanding.yml'
  pull_request:
    paths:
      - 'experiments/mutual-understanding/**'
      - '.github/workflows/mutual-understanding.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: experiments/mutual-understanding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test without third-party dependencies
        run: python -m unittest discover -s tests -v
      - name: Validate configurations
        run: |
          python -m mutual_lab validate configs/demo.json
          python -m mutual_lab validate configs/local.example.json
          python -m mutual_lab validate configs/neural.example.json
          python -m mutual_lab grid-plan configs/grid.example.json
      - name: Run an offline end-to-end demonstration
        run: python -m mutual_lab demo --seed 7 --quiet

  neural:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/mutual-understanding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only neural dependencies
        run: |
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[neural]'
      - name: Check native transfer, persistent updates, controls, restart and nested grid
        run: |
          python -m unittest discover -s tests -p test_research.py -v
          python -m unittest discover -s tests -p test_diagnostics.py -v
          python -m unittest discover -s tests -p test_first_native_training.py -v
          python -m unittest discover -s tests -p test_native_preparation.py -v
          python -m unittest discover -s tests -p test_composition_diagnostics.py -v
          python -m unittest discover -s tests -p test_development_models.py -v
          python -m unittest discover -s tests -p test_composition_suite.py -v
          python -m unittest discover -s tests -p test_composition_failure_paths.py -v
      - name: Exercise development-only diagnostic commands
        run: |
          python -m mutual_lab diagnose-native configs/neural.example.json --language es --steps 2 --eval-every 1 --train-pairs 1 --dev-pairs 1 --quiet
          python -m mutual_lab plan-screening configs/screening-plan.example.json --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutual-lab-development-diagnostics
          path: experiments/mutual-understanding/runs/diagnostics/

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/mutual-understanding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check comparison request ordering
        run: node --test tests/test_dashboard_state.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional browser check dependencies
        run: |
          python -m pip install -e '.[browser]'
          python -m playwright install --with-deps chromium
      - name: Check desktop and mobile dashboard interactions
        run: python tests/browser_smoke.py --artifacts-dir browser-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutual-lab-browser
          path: experiments/mutual-understanding/browser-artifacts/
